<div id="with-schedules" class="fade-content meme-overlay-wrapper">
  <!-- Meme 1: Jokowi YNTKTS GIF (Ukuran Diperbesar) -->
  <img src="https://media.tenor.com/BeswzKdVMiIAAAAM/yntkts.gif" class="meme-img-jokowi" alt="Jokowi YNTKTS" />
  
  <!-- Meme 2: Prabowo Joget GIF (Ukuran Diperbesar) -->
  <img src="https://media.tenor.com/gNgtEpVk_fUAAAAM/prabowo-wowo.gif" class="meme-img-prabowo" alt="Prabowo Joget" />

  <!-- Card Utama Pop-up Retro Windows -->
  <div class="meme-window-card">
    <div class="meme-title-bar">
      <span class="meme-bar-text">🇮🇩 MEME_OVERLAY_LOKAL.EXE</span>
      <div class="meme-window-btn">X</div>
    </div>

    <div class="meme-body">
      <div class="meme-badge-wrapper">
        <span class="meme-badge-tag">{tag}</span>
        <span class="meme-sub-badge">YNTKTS 🇮🇩</span>
      </div>

      <div class="title">{title}</div>

      <div class="meme-footer">
        <div class="time-info">⏰ {time}</div>
        <div class="countdown">{countdown}</div>
      </div>
    </div>
  </div>
</div>

<div id="no-schedules" class="fade-content meme-overlay-wrapper" style="display: none !important;">
  <div class="meme-window-card">
    <div class="meme-title-bar">
      <span class="meme-bar-text">404 KOSONG BANG</span>
    </div>
    <div class="meme-body">
      <span class="meme-badge-tag">{tag}</span>
      <div class="title">{empty_text}</div>
      <div class="time-info">-</div>
    </div>
  </div>
</div>
