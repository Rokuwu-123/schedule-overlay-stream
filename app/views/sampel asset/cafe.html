<style>
  /* Menghilangkan background & shadow kotak hitam bawaan aplikasi */
  #previewCard,
  .schedule-card,
  #previewFadeWrapper {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  /* Keyframe Efek Transisi Smooth Fade In & Slide Up */
  @keyframes cafeSmoothFade {
    0% {
      opacity: 0;
      transform: translateY(12px) scale(0.98);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Animasi Transisi Halus pada Teks Judul */
  @keyframes titleSmoothSlide {
    0% {
      opacity: 0.2;
      transform: translateY(6px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Penerapan Animasi pada Kartu dan Judul */
  .fade-content {
    animation: cafeSmoothFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    transition: all 0.5s ease-in-out !important;
  }

  .fade-content .title {
    animation: titleSmoothSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    transition: color 0.3s ease, transform 0.4s ease !important;
  }
</style>

<div id="with-schedules" class="fade-content" style="position: relative !important; width: 680px !important; padding: 36px 42px 30px 42px !important; background-color: #f1ebd9 !important; background-image: linear-gradient(rgba(242, 237, 226, 0.85), rgba(228, 220, 204, 0.88)), url('https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=800&auto=format&fit=crop') !important; background-size: cover !important; background-position: center !important; border: 8px solid #2b1a13 !important; border-radius: 12px !important; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 2px #4a2e22, inset 0 0 30px rgba(0, 0, 0, 0.2) !important; font-family: 'Georgia', 'Montserrat', serif !important; color: #2b1a13 !important; box-sizing: border-box !important;">
  
  <!-- Lampu Gantung Vintage Khas Kafe -->
  <div style="position: absolute !important; top: -18px !important; right: 50px !important; z-index: 10 !important; pointer-events: none !important;">
    <div style="width: 2px !important; height: 22px !important; background: #111111 !important; margin: 0 auto !important;"></div>
    <div style="width: 24px !important; height: 24px !important; background: radial-gradient(circle, #fff3cc 30%, #ffcc66 80%, rgba(255,180,0,0.6) 100%) !important; border: 2px solid #332211 !important; border-radius: 50% !important; box-shadow: 0 0 15px #ffaa00, 0 0 30px rgba(255, 170, 0, 0.6) !important;"></div>
  </div>

  <!-- Header Badge Menu Kafe -->
  <div style="display: flex !important; align-items: center !important; gap: 14px !important; margin-bottom: 14px !important;">
    <div class="tag" style="font-family: 'Georgia', serif !important; font-size: 14px !important; font-weight: 800 !important; color: #fdfaf5 !important; background: #2b1a13 !important; padding: 6px 18px !important; border-radius: 4px !important; border: 1px solid #4a2e22 !important; box-shadow: 2px 2px 6px rgba(0,0,0,0.3) !important; text-transform: uppercase !important; letter-spacing: 2px !important; margin: 0 !important;">{tag}</div>
    <span style="font-family: 'Georgia', serif !important; font-size: 14px !important; font-weight: 700 !important; color: #6b442b !important; letter-spacing: 1.5px !important;">☕ SPECIAL MENU</span>
  </div>

  <!-- Judul Stream -->
  <div class="title" style="font-family: 'Georgia', serif !important; font-size: 38px !important; font-weight: 800 !important; color: #1e120c !important; margin: 10px 0 22px 0 !important; line-height: 1.25 !important; letter-spacing: 0.5px !important; text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6) !important; word-break: break-word !important;">{title}</div>

  <!-- Footer Info Tanggal & Countdown -->
  <div style="display: flex !important; flex-direction: row !important; justify-content: space-between !important; align-items: center !important; gap: 14px !important; padding-top: 18px !important; border-top: 2px dashed #8c684d !important;">
    <div class="time-info" style="font-family: 'Arial', sans-serif !important; font-size: 15px !important; font-weight: 700 !important; color: #fdfaf5 !important; background: #242424 !important; padding: 10px 18px !important; border-radius: 6px !important; border: 2px solid #2b1a13 !important; white-space: nowrap !important; margin: 0 !important; box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.25) !important;">🕒 {time}</div>
    <div class="countdown" style="font-family: 'Arial', sans-serif !important; font-size: 15px !important; font-weight: 800 !important; color: #fdfaf5 !important; background: #6b442b !important; padding: 10px 18px !important; border-radius: 6px !important; border: 2px solid #2b1a13 !important; white-space: nowrap !important; margin: 0 !important; box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.25) !important;">{countdown}</div>
  </div>
</div>

<div id="no-schedules" class="fade-content" style="display: none !important; position: relative !important; width: 680px !important; padding: 36px 42px 30px 42px !important; background-color: #f1ebd9 !important; background-image: linear-gradient(rgba(242, 237, 226, 0.85), rgba(228, 220, 204, 0.88)), url('https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=800&auto=format&fit=crop') !important; background-size: cover !important; background-position: center !important; border: 8px solid #2b1a13 !important; border-radius: 12px !important;">
  <div class="tag" style="font-family: 'Georgia', serif !important; font-size: 14px !important; font-weight: 800 !important; color: #fdfaf5 !important; background: #2b1a13 !important; padding: 6px 18px !important; border-radius: 4px !important; display: inline-block !important;">{tag}</div>
  <div class="title" style="font-family: 'Georgia', serif !important; font-size: 32px !important; font-weight: 800 !important; color: #1e120c !important; margin-top: 12px !important;">{empty_text}</div>
  <div class="time-info" style="display: none !important;">-</div>
</div>
